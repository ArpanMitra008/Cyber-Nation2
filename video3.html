<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Group Video Call</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #e0f7fa;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h2 {
      margin-bottom: 10px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      width: 90%;
      max-width: 800px;
    }

    .controls input {
      padding: 12px;
      width: 100%;
      max-width: 250px;
      border-radius: 16px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.08);
      color: white;
      text-align: center;
      font-size: 15px;
      backdrop-filter: blur(6px);
      box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.05);
    }

    #video-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 10px;
    }

    video {
      width: 250px;
      border-radius: 15px;
      border: 2px solid #00bcd4;
      box-shadow: 0 0 15px #00bcd4;
    }

    .icon-bar {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .icon-btn {
      font-size: 26px;
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 8px rgba(0,229,255,0.2);
      transition: 0.3s ease;
    }

    .icon-btn:hover {
      background: rgba(0, 229, 255, 0.3);
      transform: scale(1.1);
    }

    .hide {
      display: none;
    }
  </style>
</head>
<body>
  <h2>Group Video Call</h2>

  <div class="controls" id="setup">
    <input type="text" id="username" placeholder="Enter your name" />
    <button class="icon-btn" onclick="init()">➡️</button>
  </div>

  <div class="controls" id="room-setup" style="display:none;">
    <button class="icon-btn" onclick="createRoom()">➕</button>
    <input type="text" id="room-id" placeholder="Room ID to join" />
    <button class="icon-btn" onclick="joinRoom()">🔗</button>
  </div>

  <div id="video-container">
    <video id="my-video" autoplay muted></video>
  </div>

  <div class="icon-bar" id="icon-bar" style="display:none;">
    <button class="icon-btn" id="mic-btn" onclick="toggleMic()">🎤</button>
    <button class="icon-btn" id="cam-btn" onclick="toggleCamera()">🎥</button>
    <button class="icon-btn" onclick="sendReaction('❤️')">❤️</button>
    <button class="icon-btn" onclick="sendReaction('😂')">😂</button>
    <button class="icon-btn hide" id="end-call" onclick="endCall()">❌</button>
    <button class="icon-btn hide" id="leave-call" onclick="leaveCall()">🚪</button>
  </div>

  <script>
    let userStream;
    const peerConnections = {};
    let isHost = false;

    let roomId = ""; // Unique Room ID for local communication

    async function init() {
      const username = document.getElementById('username').value.trim();
      if (!username) return alert("Enter a name!");

      // Show Room Setup
      document.getElementById('setup').style.display = 'none';
      document.getElementById('room-setup').style.display = 'flex';

      try {
        // Access media devices
        userStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('my-video').srcObject = userStream;
      } catch (err) {
        alert('Error accessing media devices: ' + err);
        console.error(err);
      }
    }

    // Create Room (Host)
    function createRoom() {
      isHost = true;
      roomId = Math.floor(Math.random() * 1000000).toString();
      alert(`Room ID: ${roomId}`);
      document.getElementById('room-setup').style.display = 'none';
      showControls();
    }

    // Join Room
    function joinRoom() {
      const roomIdInput = document.getElementById('room-id').value.trim();
      if (!roomIdInput) return alert("Enter Room ID");

      roomId = roomIdInput;
      alert(`You joined Room: ${roomId}`);
      document.getElementById('room-setup').style.display = 'none';
      showControls();
    }

    // Show video and controls
    function showControls() {
      document.getElementById('icon-bar').style.display = 'flex';
      document.getElementById('leave-call').classList.remove('hide');
      if (isHost) {
        document.getElementById('end-call').classList.remove('hide');
      }
      connectToOtherPeers();
    }

    // Connect to other peers using WebRTC
    function connectToOtherPeers() {
      // Assuming roomId uniquely identifies users in the room
      const peersInRoom = getPeersInRoom(roomId);
      
      peersInRoom.forEach(peerId => {
        const peerConnection = new RTCPeerConnection();
        peerConnections[peerId] = peerConnection;

        // Add local stream to peer connection
        userStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, userStream);
        });

        // Handle remote stream from peer
        peerConnection.ontrack = event => {
          addVideoStream(peerId, event.streams[0]);
        };

        // Create an offer and send it to the peer
        peerConnection.createOffer()
          .then(offer => {
            return peerConnection.setLocalDescription(offer);
          })
          .then(() => {
            sendSignalToPeer(peerId, peerConnection.localDescription);
          })
          .catch(err => {
            console.error('Error creating offer:', err);
          });
      });
    }

    // Function to simulate getting peers in the room
    function getPeersInRoom(roomId) {
      // In a real app, you'd get this list from the signaling server or session management.
      return roomId ? ["peer1", "peer2"] : [];
    }

    // Send signaling data to the peer (This is simplified; in real-world applications, you'd need a signaling server)
    function sendSignalToPeer(peerId, signalData) {
      // In a real app, this would send via WebSocket or similar
      console.log(`Sending signal to ${peerId}:`, signalData);
    }

    // Add Video Stream to the container
    function addVideoStream(peerId, stream) {
      const video = document.createElement('video');
      video.srcObject = stream;
      video.id = peerId;
      video.autoplay = true;
      video.playsInline = true;
      document.getElementById('video-container').appendChild(video);
    }

    // Toggle Microphone
    function toggleMic() {
      const audioTrack = userStream.getAudioTracks()[0];
      audioTrack.enabled = !audioTrack.enabled;
      document.getElementById('mic-btn').textContent = audioTrack.enabled ? '🎤' : '🔇';
    }

    // Toggle Camera
    function toggleCamera() {
      const videoTrack = userStream.getVideoTracks()[0];
      videoTrack.enabled = !videoTrack.enabled;
      document.getElementById('cam-btn').textContent = videoTrack.enabled ? '🎥' : '📷';
    }

    // Send Reaction
    function sendReaction(emoji) {
      alert(`Sent: ${emoji}`);
    }

    // End the Call (Host only)
    function endCall() {
      alert("Meeting ended by host.");
      window.location.reload();
    }

    // Leave the Call
    function leaveCall() {
      alert("You left the meeting.");
      window.location.reload();
    }
  </script>
</body>
</html>
